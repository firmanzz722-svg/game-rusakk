<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Love Edition</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 20px; width: 100%;
            text-align: center; color: #ff007f; font-size: 24px;
            font-weight: bold; text-shadow: 0 0 10px #fff;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui">SKOR: <span id="scoreText">0</span></div>
    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreText = document.getElementById("scoreText");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // --- PENGATURAN GAMBAR & SUARA ---
    const imgAku = new Image();
    imgAku.src = 'foto_aku.png'; // GANTI dengan nama file fotomu

    const imgCewe = new Image();
    imgCewe.src = 'kita.png'; // GANTI dengan nama file foto berdua

    // Suara menggunakan synthesizer (tanpa file eksternal agar tidak error)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(freq, type, duration) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
    }

    // Variabel Game
    let bird = { x: 50, y: canvas.height/2, w: 50, h: 50, gravity: 0.6, lift: -10, velocity: 0 };
    let pipes = [];
    let frame = 0;
    let score = 0;
    let gameActive = true;
    let showSurprise = false;

    function createPipe() {
        let gap = 170;
        let height = Math.floor(Math.random() * (canvas.height - gap - 100)) + 50;
        pipes.push({ x: canvas.width, top: height, bottom: canvas.height - (height + gap), w: 60, passed: false });
    }

    function jump() {
        if (!gameActive) { resetGame(); return; }
        bird.velocity = bird.lift;
        playSound(400, 'sine', 0.1); // Suara lompat
    }

    window.addEventListener("touchstart", (e) => { jump(); e.preventDefault(); }, {passive: false});
    window.addEventListener("mousedown", jump);

    function resetGame() {
        bird.y = canvas.height / 2;
        bird.velocity = 0;
        pipes = [];
        score = 0;
        frame = 0;
        showSurprise = false;
        scoreText.innerText = score;
        gameActive = true;
        animate();
    }

    function animate() {
        if (!gameActive) return;

        // Background
        ctx.fillStyle = "#050505";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Update Bird
        bird.velocity += bird.gravity;
        bird.y += bird.velocity;

        // Gambar Karakter (Foto Kamu)
        ctx.save();
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#ff007f";
        if (imgAku.complete && imgAku.width > 0) {
            ctx.drawImage(imgAku, bird.x, bird.y, bird.w, bird.h);
        } else {
            ctx.fillStyle = "#0f0"; // Kotak hijau jika foto belum ada
            ctx.fillRect(bird.x, bird.y, bird.w, bird.h);
        }
        ctx.restore();

        if (bird.y + bird.h > canvas.height || bird.y < 0) endGame();

        // Pipa
        if (frame % 100 === 0) createPipe();
        for (let i = pipes.length - 1; i >= 0; i--) {
            pipes[i].x -= 3;

            // Gambar Pipa Neon
            ctx.fillStyle = "#ff007f";
            ctx.fillRect(pipes[i].x, 0, pipes[i].w, pipes[i].top);
            ctx.fillRect(pipes[i].x, canvas.height - pipes[i].bottom, pipes[i].w, pipes[i].bottom);

            // Cek Tabrakan
            if (bird.x < pipes[i].x + pipes[i].w && bird.x + bird.w > pipes[i].x &&
                (bird.y < pipes[i].top || bird.y + bird.h > canvas.height - pipes[i].bottom)) {
                endGame();
            }

            if (!pipes[i].passed && pipes[i].x < bird.x) {
                score++;
                scoreText.innerText = score;
                pipes[i].passed = true;
                if(score === 100) showSurprise = true;
            }
            if (pipes[i].x + pipes[i].w < 0) pipes.splice(i, 1);
        }

        // Skor 100 Surprise!
        if (showSurprise) {
            ctx.drawImage(imgCewe, canvas.width/2 - 100, 100, 200, 200);
            ctx.fillStyle = "white";
            ctx.font = "20px Arial";
            ctx.textAlign = "center";
            ctx.fillText("HAPPY 100!", canvas.width/2, 330);
        }

        frame++;
        requestAnimationFrame(animate);
    }

    function endGame() {
        gameActive = false;
        playSound(150, 'sawtooth', 0.5); // Suara Kalah
        ctx.fillStyle = "rgba(0,0,0,0.8)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.font = "30px Arial";
        ctx.fillText("GAME OVER", canvas.width/2, canvas.height/2);
        ctx.font = "18px Arial";
        ctx.fillText("Sentuh untuk Coba Lagi", canvas.width/2, canvas.height/2 + 50);
    }

    animate();
</script>
</body>
</html>
